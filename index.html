<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>クラブ台帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="クラブ台帳">
<meta name="theme-color" content="#1d3557">
<!-- APP_BUILD 0.3.7 2026-11-25 -->
<style>
:root{
  --bg:#f6f7f5; --card:#fff; --fg:#1d2420; --muted:#6b736e; --line:#dfe3df;
  --accent:#1d3557; --accent-weak:#e4eaf3; --head:#1d3557; --on-accent:#fff; --warn:#c0392b; --warn-weak:#fbe9e7; --amber:#b7791f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141816; --card:#1d2320; --fg:#e6ebe8; --muted:#9aa49f; --line:#2f3733;
    --accent:#8fb0e0; --accent-weak:#1f2b3d; --head:#1d3557; --on-accent:#0f1a2b; --warn:#ef6b5d; --warn-weak:#3a2220; --amber:#e0a84a; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Yu Gothic","游ゴシック",YuGothic,"Hiragino Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);color:#fff;border:0}
main{padding:12px 16px 96px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;border-radius:0;background:none;padding:12px 4px;color:var(--muted);font-weight:600}
.lad .lrow{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:6px}
.lad .lrow.new{background:var(--accent-weak)}
.lad .lnm{flex:0 0 22%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lad .lbar{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.lad .lbar div{height:14px;background:var(--accent);border-radius:3px}
.lad .lbar span{font-size:13px;white-space:nowrap}
select.dsel{width:auto;flex:none;padding:4px 6px;font-size:13px;min-width:76px}
.lad .gap{font-size:11px;color:var(--muted);padding:0 0 0 24%;line-height:1.6}
.lad .gap.wide,.lad .gap.near{color:var(--warn);font-weight:600}
.lad .lbar .bw{position:relative;height:14px;flex:1;min-width:0;background:transparent}
.lad .lbar .bw div{position:absolute;left:0;top:0}
.lad .lbar .bw .rg{height:14px;background:var(--accent);opacity:.35;border-radius:3px}
.drng{display:inline-flex;align-items:center;gap:2px;flex:none;font-size:12px}
.drng input{width:40px;padding:4px 3px;font-size:13px;text-align:center}
nav.tabs button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
h2{font-size:15px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:12px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.warn{color:var(--warn);border-color:var(--warn)}
button.sm{padding:4px 9px;font-size:13px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%}
textarea{min-height:84px}
label.f{display:block;margin-bottom:8px}
label.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.club{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--accent-weak);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700}
.club .body{min-width:0;flex:1}
.club .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bagchk{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 2px;cursor:pointer}
.bagchk input{width:26px;height:26px;margin:0;accent-color:var(--accent);cursor:pointer}
.club .ln{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-weak);color:var(--accent);font-weight:600}
.badge.w{background:var(--warn-weak);color:var(--warn)}
.hist{border-top:1px solid var(--line);padding:8px 0;display:flex;gap:8px;align-items:flex-start}
.hist:first-child{border-top:0}
.hist .d{font-size:12px;color:var(--muted);width:84px;flex:none}
.hist .t{flex:1;min-width:0;word-break:break-all}
.cur{font-size:11px;color:var(--accent);font-weight:700}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
details>summary{cursor:pointer;font-weight:700;margin:14px 0 8px}
details.sec>summary{font-size:16px;padding:6px 2px;border-bottom:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:right}
th:first-child,td:first-child{text-align:left}
td.out{color:var(--warn);font-weight:700}
a{color:var(--accent)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#modal h3{margin:0 0 12px;font-size:16px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:30;max-width:90vw}
#upd{display:none;background:var(--warn-weak);color:var(--fg);padding:10px 16px;border-bottom:1px solid var(--line)}
#upd.on{display:block}
.notice{background:var(--warn-weak);border-radius:8px;padding:10px;font-size:13px}
svg text{fill:var(--muted);font-size:10px}
svg .lbl{fill:var(--fg);font-size:10px}
</style>
</head>
<body>
<header><h1 id="ttl">クラブ台帳</h1><span class="xs" style="opacity:.8">v<span id="ver"></span></span></header>
<div id="upd"></div>
<main id="app"><p class="muted">読み込み中…</p></main>
<nav class="tabs">
  <button data-v="bag" onclick="go('bag')">バッグ</button>
  <button data-v="ladder" onclick="go('ladder')">飛距離</button>
  <button data-v="flow" onclick="go('flow')">重量フロー</button>
  <button data-v="data" onclick="go('data')">データ</button>
</nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<datalist id="dl-num"></datalist><datalist id="dl-maker"></datalist><datalist id="dl-series"></datalist>
<datalist id="dl-smaker"></datalist><datalist id="dl-sseries"></datalist><datalist id="dl-gmaker"></datalist><datalist id="dl-shop"></datalist>
<script>
'use strict';
const APP_VERSION='0.3.7';
const APP_BUILD_DATE='2026-11-25';
const SCHEMA=1;
const DBNAME='club-ledger', DBVER=1;   // ★保存先の名前と版。変えるときは明示許可制（DESIGN.md）

/* ---------- 選択肢 ---------- */
const KINDS=[['W','ドライバー'],['FW','フェアウェイウッド'],['UT','ユーティリティ'],['I','アイアン'],['WG','ウェッジ'],['PT','パター'],['他','その他']];
const STATUS=[['bag','バッグ'],['spare','控え'],['sold','売却済'],['gone','手放した（売却以外）']];
const NUMS=['1W','2W','3W','4W','5W','7W','9W','11W','2U','3U','4U','5U','6U','7U','1I','2I','3I','4I','5I','6I','7I','8I','9I','PW','AW','GW','SW','LW','46°','48°','50°','52°','54°','56°','58°','60°','62°','PT'];
const MAKERS=['Titleist','Callaway','TaylorMade','PING','Srixon','Cleveland','Mizuno','Bridgestone','Honma','Yamaha','Cobra','PXG','Majesty','XXIO','Odyssey','Scotty Cameron','Fourteen','Epon','Miura','Wilson'];
const FLEX=['L','A','R','R2','SR','S','S+','X','TX'];
const KICK=['先','先中','中','中元','元'];
const COND=['新品','中古'];
const RANK=['S','A','B','C','D'];
function range(a,b,st,fmt){ const o=[]; for(let v=a; v<=b+1e-9; v=Math.round((v+st)*1000)/1000) o.push([v,fmt?fmt(v):String(v)]); return o; }
const BAL=(()=>{ const o=[]; 'ABCDEFG'.split('').forEach(L=>{ for(let d=0;d<=9;d++) o.push(L+d); }); return o; })();
const LEN=range(30,48,0.25,v=>v.toFixed(2)+'″');
const LOFT=range(0,72,0.5,v=>v.toFixed(1)+'°');
const LIE=range(45,75,0.25,v=>v.toFixed(2)+'°');
const DIST=range(0,350,5,v=>v+'y');
const YEARS=(()=>{ const y=new Date().getFullYear()+1, o=[]; for(let v=y; v>=1980; v--) o.push([v,String(v)]); return o; })();

/* 履歴・取引の項目定義（t: date/text/num/sel/area、n: 数値で保存、dl: 候補リスト、u: 単位） */
const F={
  shafts:{ttl:'シャフト', hist:true, f:[
    {k:'date',l:'装着日',t:'date'},{k:'maker',l:'メーカー',t:'text',dl:'dl-smaker'},{k:'series',l:'シリーズ',t:'text',dl:'dl-sseries'},
    {k:'flex',l:'フレックス',t:'sel',o:FLEX},{k:'weight',l:'重量',t:'num',u:'g'},{k:'torque',l:'トルク',t:'num'},
    {k:'kick',l:'調子',t:'sel',o:KICK},{k:'note',l:'メモ（リシャフト理由・カット長など）',t:'area'}]},
  grips:{ttl:'グリップ', hist:true, f:[
    {k:'date',l:'交換日',t:'date'},{k:'maker',l:'メーカー',t:'text',dl:'dl-gmaker'},{k:'model',l:'モデル',t:'text'},
    {k:'weight',l:'重量',t:'num',u:'g'},{k:'note',l:'メモ',t:'area'}]},
  meas:{ttl:'実測', hist:true, f:[
    {k:'date',l:'測定日',t:'date'},{k:'total',l:'総重量',t:'num',u:'g'},{k:'balance',l:'バランス（14インチ式）',t:'sel',o:BAL},
    {k:'length',l:'長さ（60度法）',t:'sel',o:LEN,n:1},{k:'loft',l:'ロフト',t:'sel',o:LOFT,n:1},{k:'lie',l:'ライ',t:'sel',o:LIE,n:1},
    {k:'cpm',l:'振動数',t:'num',u:'cpm'},{k:'headW',l:'ヘッド重量',t:'num',u:'g'},{k:'note',l:'メモ（鉛・調整など）',t:'area'}]},
  play:{ttl:'ラウンド情報（想定距離・コメント）', hist:true, f:[
    {k:'date',l:'日付',t:'date'},{k:'dist',l:'想定距離（キャリー）',t:'sel',o:DIST,n:1},
    {k:'distLo',l:'幅の下限（幅を入れると、想定距離は幅の中央になります）',t:'num',u:'y'},{k:'distHi',l:'幅の上限',t:'num',u:'y'},{k:'note',l:'コメント',t:'area'}]},
  buy:{ttl:'購入', hist:false, f:[
    {k:'date',l:'購入日',t:'date'},{k:'shop',l:'購入先',t:'text',dl:'dl-shop'},{k:'cond',l:'新品／中古',t:'sel',o:COND},
    {k:'rank',l:'中古ランク',t:'sel',o:RANK},{k:'price',l:'価格（税込）',t:'num',u:'円'},{k:'note',l:'メモ',t:'area'}]},
  sell:{ttl:'売却', hist:false, f:[
    {k:'date',l:'売却日',t:'date'},{k:'to',l:'売却先',t:'text',dl:'dl-shop'},{k:'price',l:'価格',t:'num',u:'円'},{k:'note',l:'メモ',t:'area'}]},
};

/* ---------- 共通 ---------- */
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowIso(){ return new Date().toISOString(); }
function toNum(v){ if(v==null) return null; v=String(v).replace(/[０-９．－]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,\s円g]/g,''); if(v==='') return null; const n=parseFloat(v); return isNaN(n)?null:n; }
function yen(n){ return n==null?'':Number(n).toLocaleString('ja-JP')+'円'; }
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',2600); }
function optHtml(opts,val,req){ let found=false; const h=opts.map(o=>{ const v=Array.isArray(o)?o[0]:o, l=Array.isArray(o)?o[1]:o; const s=(val!=null&&String(val)===String(v)); if(s) found=true; return '<option value="'+esc(v)+'"'+(s?' selected':'')+'>'+esc(l)+'</option>'; }).join('');
  if(req&&(val==null||val==='')) return '<option value="" selected disabled>（未設定）</option>'+h;
  return (req?'':'<option value=""></option>')+(val!=null&&val!==''&&!found?'<option value="'+esc(val)+'" selected>'+esc(val)+'</option>':'')+h; }
function balNum(b){ if(!b) return null; const m=/^([A-G])(\d(?:\.\d)?)$/.exec(String(b).trim().toUpperCase()); return m?('ABCDEFG'.indexOf(m[1])*10+parseFloat(m[2])):null; }
function balStr(n){ if(n==null||isNaN(n)) return ''; const L='ABCDEFG'[Math.floor(n/10)]||'?'; return L+(Math.round((n%10)*10)/10); }

/* ---------- 保存（IndexedDB） ---------- */
let db=null, CLUBS=[], PHOTOS={}; // PHOTOS: clubId -> [{id,date,caption,url}]
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DBNAME,DBVER);
  r.onupgradeneeded=()=>{ const d=r.result;
    if(!d.objectStoreNames.contains('clubs')) d.createObjectStore('clubs',{keyPath:'id'});
    if(!d.objectStoreNames.contains('photos')){ const s=d.createObjectStore('photos',{keyPath:'id'}); s.createIndex('clubId','clubId'); }
    if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'k'}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=db.transaction(store,mode), s=t.objectStore(store); let out; const r=fn(s); if(r) r.onsuccess=()=>{ out=r.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const getAll=st=>tx(st,'readonly',s=>s.getAll());
const dbPut=(st,v)=>tx(st,'readwrite',s=>s.put(v));
const dbDel=(st,k)=>tx(st,'readwrite',s=>s.delete(k));
const dbGet=(st,k)=>tx(st,'readonly',s=>s.get(k));

let LASTBK=null;   // 最後にバックアップを書き出した日時（meta lastBackup）
async function loadAll(){
  CLUBS=await getAll('clubs'); try{ const r=await dbGet('meta','lastBackup'); LASTBK=r&&r.v||null; }catch(e){ LASTBK=null; }
  Object.values(PHOTOS).flat().forEach(p=>URL.revokeObjectURL(p.url)); PHOTOS={};
  (await getAll('photos')).forEach(p=>{ (PHOTOS[p.clubId]=PHOTOS[p.clubId]||[]).push({id:p.id,date:p.date,caption:p.caption||'',url:URL.createObjectURL(p.blob)}); });
  Object.values(PHOTOS).forEach(a=>a.sort((x,y)=>(x.date||'').localeCompare(y.date||'')));
  fillDatalists();
}

/* ---------- クラブ ---------- */
function newClub(){ const t=nowIso(); return {id:uid('c'),schema:SCHEMA,name:'',nameAuto:true,kind:'I',num:'',maker:'',series:'',year:null,setName:'',loftSpec:null,lieSpec:null,status:'bag',
  shafts:[],grips:[],meas:[],play:[],buy:{},sell:{},memo:'',createdAt:t,updatedAt:t,deletedAt:null}; }
function autoName(c){ return [c.num,c.maker,c.series].map(v=>String(v==null?'':v).trim()).filter(Boolean).join(' ')||'（名称未設定）'; }
function nameOf(c){ return c.nameAuto?autoName(c):(c.name||autoName(c)); }
function clubById(id){ return CLUBS.find(c=>c.id===id); }
async function saveClub(c){ c.updatedAt=nowIso(); if(c.nameAuto) c.name=autoName(c); await dbPut('clubs',c);
  const i=CLUBS.findIndex(x=>x.id===c.id); if(i<0) CLUBS.push(c); else CLUBS[i]=c; fillDatalists(); }
function sortedHist(arr){ return (arr||[]).map((h,i)=>[h,i]).sort((a,b)=>((b[0].date||'').localeCompare(a[0].date||''))||(b[1]-a[1])).map(x=>x[0]); }
function latest(arr){ return sortedHist(arr)[0]||null; }
/* 飛距離の幅（v0.3.7）: 記録 play に distLo / distHi を足すだけ。dist は従来どおり代表値（幅があるときは中央を四捨五入）で、
   並べ方・差・CSV・文字の書き出しは dist を使う。幅の無い従来の記録はそのまま（1点の記録として扱う） */
function hasRng(p){ return !!p&&p.distLo!=null&&p.distHi!=null; }
function distTxt(p){ if(!p) return ''; if(hasRng(p)) return p.distLo===p.distHi?p.distLo+'y':p.distLo+'–'+p.distHi+'y'; return p.dist!=null?p.dist+'y':''; }
function setDist(p,lo,hi){ if(lo!=null&&hi!=null&&lo>hi){ const t=lo; lo=hi; hi=t; }
  if(lo!=null&&hi!=null&&lo!==hi){ p.distLo=lo; p.distHi=hi; p.dist=Math.round((lo+hi)/2); }
  else { p.dist=lo!=null?lo:hi; delete p.distLo; delete p.distHi; } }
function kindIdx(k){ const i=KINDS.findIndex(x=>x[0]===k); return i<0?99:i; }
function orderKey(c){ const m=latest(c.meas); const lf=c.loftSpec!=null?c.loftSpec:(m&&m.loft!=null?m.loft:null); const n=parseFloat(String(c.num||'').replace(/[^\d.]/g,'')); return [kindIdx(c.kind), lf!=null?lf:(isNaN(n)?999:n)]; }
function sortClubs(a){ return a.slice().sort((x,y)=>{ const p=orderKey(x), q=orderKey(y); return (p[0]-q[0])||(p[1]-q[1])||nameOf(x).localeCompare(nameOf(y)); }); }
function liveClubs(){ return CLUBS.filter(c=>!c.deletedAt); }

function sumOf(sec,h){ if(!h) return '';
  if(sec==='shafts') return [h.maker,h.series,h.flex].filter(Boolean).join(' ')+(h.weight!=null?' '+h.weight+'g':'')+(h.torque!=null?' / T'+h.torque:'')+(h.kick?' / '+h.kick+'調子':'');
  if(sec==='grips') return [h.maker,h.model].filter(Boolean).join(' ')+(h.weight!=null?' '+h.weight+'g':'');
  if(sec==='meas') return [h.total!=null?h.total+'g':'',h.balance||'',h.length!=null?h.length.toFixed(2)+'″':'',h.loft!=null?'ロフト'+h.loft+'°':'',h.lie!=null?'ライ'+h.lie+'°':'',h.cpm!=null?h.cpm+'cpm':'',h.headW!=null?'ヘッド'+h.headW+'g':''].filter(Boolean).join(' / ');
  if(sec==='play') return distTxt(h);
  if(sec==='buy') return [h.shop,h.cond,h.rank?'ランク'+h.rank:'',yen(h.price)].filter(Boolean).join(' / ');
  if(sec==='sell') return [h.to,yen(h.price)].filter(Boolean).join(' / ');
  return ''; }

function fillDatalists(){
  const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y));
  const set=(id,a)=>{ $(id).innerHTML=a.map(v=>'<option value="'+esc(v)+'">').join(''); };
  const L=liveClubs();
  set('dl-num',NUMS);
  set('dl-maker',uniq(MAKERS.concat(L.map(c=>c.maker))));
  set('dl-series',uniq(L.map(c=>c.series)));
  set('dl-smaker',uniq(L.flatMap(c=>c.shafts.map(s=>s.maker))));
  set('dl-sseries',uniq(L.flatMap(c=>c.shafts.map(s=>s.series))));
  set('dl-gmaker',uniq(L.flatMap(c=>c.grips.map(s=>s.maker))));
  set('dl-shop',uniq(L.flatMap(c=>[c.buy&&c.buy.shop,c.sell&&c.sell.to])));
}

/* ---------- 画面切替 ---------- */
let ST={view:'bag', id:null, flowX:'len', flowY:'total', flowSpare:false, flowPT:false};
function go(v){ ST.view=v; ST.id=null; render(); window.scrollTo(0,0); }
function openClub(id){ ST.view='club'; ST.id=id; render(); window.scrollTo(0,0); }
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===(ST.view==='club'?'bag':ST.view==='trash'?'data':ST.view)));
  const app=$('app');
  if(ST.view==='bag') app.innerHTML=viewBag();
  else if(ST.view==='club') app.innerHTML=viewClub();
  else if(ST.view==='flow') app.innerHTML=viewFlow();
  else if(ST.view==='ladder') app.innerHTML=viewLadder();
  else if(ST.view==='data'){ app.innerHTML=viewData(); refreshDataStats(); refreshAiStat(); }
  else if(ST.view==='trash') app.innerHTML=viewTrash();
  $('ttl').textContent=ST.view==='club'&&clubById(ST.id)?nameOf(clubById(ST.id)):'クラブ台帳';
}

/* ---------- バッグ ---------- */
function clubCard(c){
  const ph=(PHOTOS[c.id]||[])[0], s=latest(c.shafts), m=latest(c.meas), p=latest(c.play);
  const th=ph?'<img class="thumb" src="'+ph.url+'" alt="">':'<div class="thumb">'+esc(c.num||c.kind)+'</div>';
  const l1=[c.series,c.year?c.year+'年':''].filter(Boolean).join(' / ');
  return '<div class="card club" onclick="openClub(\''+c.id+'\')">'+th+'<div class="body"><div class="nm">'+esc(nameOf(c))+'</div>'+
    (l1?'<div class="ln">'+esc(l1)+'</div>':'')+(s?'<div class="ln">シャフト: '+esc(sumOf('shafts',s))+'</div>':'')+
    (m?'<div class="ln">実測: '+esc(sumOf('meas',m))+'</div>':'')+(p&&p.dist!=null?'<div class="ln">想定 '+distTxt(p)+'</div>':'')+'</div>'+
    ((c.status!=='sold'&&c.status!=='gone')?'<label class="bagchk" onclick="event.stopPropagation()"><input type="checkbox"'+(c.status==='bag'?' checked':'')+' onchange="toggleBag(\''+c.id+'\',this.checked)" aria-label="バッグに入れる">バッグ</label>':'')+'</div>';
}
function viewBag(){
  const L=sortClubs(liveClubs()); const nBag=L.filter(c=>c.status==='bag').length;
  let h='<div class="row" style="margin:4px 0 6px"><span>バッグ <b>'+nBag+'</b> 本</span>'+(nBag>14?'<span class="badge w">14本を超えています</span>':'')+'<span style="flex:1"></span><label style="cursor:pointer"><span class="badge" style="padding:8px 12px">写真から追加</span><input type="file" accept="image/*" multiple style="display:none" onchange="addClubFromPhotos(this.files)"></label><button class="pri" onclick="addClub()">＋ クラブを追加</button></div>';
  if(L.length) h+=bkNotice();
  if(!L.length) return h+'<div class="card muted">まだクラブがありません。「＋ クラブを追加」から登録してください。</div>';
  const odd=L.filter(c=>!STATUS.some(x=>x[0]===c.status));
  if(odd.length) h+='<h2>状態が未設定（'+odd.length+'）</h2><p class="xs muted" style="margin:-4px 0 8px">「バッグ」にチェックを付けるか、クラブを開いて状態を選んでください。</p>'+odd.map(clubCard).join('');
  STATUS.forEach(([k,lab])=>{ const a=L.filter(c=>c.status===k); if(!a.length) return;
    const body=a.map(clubCard).join('');
    h+= (k==='bag'||k==='spare') ? '<h2>'+lab+'（'+a.length+'）</h2>'+body : '<details><summary>'+lab+'（'+a.length+'）</summary>'+body+'</details>'; });
  return h;
}
/* 一覧のチェックでバッグ⇔控えを切り替える（描き直して本数・見出しを更新。スクロール位置は保つ） */
async function toggleBag(id,on){ const c=clubById(id); if(!c) return; c.status=on?'bag':'spare'; await saveClub(c);
  const y=window.scrollY; render(); window.scrollTo(0,y); const n=liveClubs().filter(x=>x.status==='bag').length;
  toast((on?'バッグに入れました':'控えに移しました')+'（バッグ '+n+'本）'); }
/* バックアップの催促（30日を過ぎるか、一度も書き出していなければ目立たせる） */
const BK_DAYS=30;
function bkNotice(){ const d=LASTBK?Math.floor((Date.now()-new Date(LASTBK).getTime())/86400000):null;
  const late=d==null||d>=BK_DAYS;
  const msg=d==null?'まだバックアップを書き出していません':(d===0?'最後のバックアップ: 今日':'最後のバックアップ: '+d+'日前');
  return '<div class="'+(late?'notice':'xs muted')+'" style="margin:0 0 8px;cursor:pointer" onclick="go(\'data\')">'+msg+(late?'。データはこの端末の中だけにあります。データ画面から書き出してください ›':' ›')+'</div>'; }
async function addClub(){ const c=newClub(); await saveClub(c); openClub(c.id); }

/* ---------- クラブ詳細 ---------- */
function fld(f,val,attr){ attr=attr||''; const lab='<span>'+esc(f.l)+(f.u?'（'+esc(f.u)+'）':'')+'</span>';
  let inp;
  if(f.t==='date') inp='<input type="date" name="'+f.k+'" value="'+esc(val||'')+'" '+attr+'>';
  else if(f.t==='sel') inp='<select name="'+f.k+'" '+attr+'>'+optHtml(f.o,val,f.req)+'</select>';
  else if(f.t==='area'){ const id='ta_'+f.k; inp='<textarea id="'+id+'" name="'+f.k+'" '+attr+'>'+esc(val||'')+'</textarea>'+micBtn(id); }
  else if(f.t==='num') inp='<input name="'+f.k+'" inputmode="decimal" value="'+esc(val==null?'':val)+'" '+attr+'>';
  else inp='<input name="'+f.k+'" value="'+esc(val||'')+'"'+(f.dl?' list="'+f.dl+'"':'')+' autocomplete="off" '+attr+'>';
  return '<label class="f">'+lab+inp+'</label>'; }

const BASIC=[
  {k:'kind',l:'種別',t:'sel',o:KINDS,req:true},{k:'num',l:'番手',t:'text',dl:'dl-num'},
  {k:'maker',l:'メーカー',t:'text',dl:'dl-maker'},{k:'series',l:'シリーズ・モデル',t:'text',dl:'dl-series'},
  {k:'year',l:'発売年',t:'sel',o:YEARS,n:1},{k:'setName',l:'セット名（アイアンセット等）',t:'text'},
  {k:'loftSpec',l:'ロフト（カタログ）',t:'sel',o:LOFT,n:1},{k:'lieSpec',l:'ライ（カタログ）',t:'sel',o:LIE,n:1},
  {k:'status',l:'状態',t:'sel',o:STATUS,req:true}];

  let h='<div class="row" style="margin-bottom:8px"><button onclick="go(\'bag\')">← 一覧</button><span style="flex:1"></span><span class="xs muted">ID: '+esc(c.id)+'</span></div>';
  // 名前
  h+='<div class="card"><label class="f"><span>名前 '+(c.nameAuto?'<span class="badge">自動（番手 メーカー シリーズ）</span>':'<span class="badge">手入力</span>')+'</span>'+
     '<input id="cname" value="'+esc(nameOf(c))+'" onchange="setName(this.value)"></label>'+
     (c.nameAuto?'':'<button class="sm" onclick="resetName()">自動に戻す</button>')+'</div>';
  // 基本
  h+='<h2>基本情報<span class="sp"></span><button class="sm" onclick="specStart(false)">番手のスペックを取り直す</button></h2><div class="card grid2">'+BASIC.map(f=>fld(f,c[f.k],'onchange="setBasic(\''+f.k+'\',this.value)"')).join('')+'</div>';
  // 履歴
  ['shafts','grips','meas','play'].forEach(sec=>{ const d=F[sec], arr=sortedHist(c[sec]);
    h+='<h2>'+esc(d.ttl)+'<span class="sp"></span><button class="sm" onclick="editHist(\''+sec+'\',null)">＋ 追加</button></h2><div class="card">';
    if(!arr.length) h+='<div class="muted sm">記録なし</div>';
    arr.forEach((x,i)=>{ const note=x.note?'<div class="xs muted" style="white-space:pre-wrap">'+esc(x.note)+'</div>':'';
      h+='<div class="hist"><div class="d">'+esc(x.date||'日付なし')+(i===0?'<div class="cur">現在</div>':'')+'</div><div class="t">'+esc(sumOf(sec,x)||'')+note+'</div><button class="sm" onclick="editHist(\''+sec+'\',\''+x.id+'\')">編集</button></div>'; });
    h+='</div>'; });
  // 購入・売却
  h+='<h2>購入・売却</h2><div class="card">';
  ['buy','sell'].forEach(sec=>{ const x=c[sec]||{}; const s=sumOf(sec,x);
    h+='<div class="hist"><div class="d">'+esc(F[sec].ttl)+'<br>'+esc(x.date||'')+'</div><div class="t">'+(s?esc(s):'<span class="muted">未入力</span>')+(x.note?'<div class="xs muted" style="white-space:pre-wrap">'+esc(x.note)+'</div>':'')+'</div><button class="sm" onclick="editHist(\''+sec+'\',null)">編集</button></div>'; });
  if(c.buy&&c.buy.price!=null&&c.sell&&c.sell.price!=null) h+='<div class="sm" style="margin-top:6px">実質コスト（購入−売却）: <b>'+yen(c.buy.price-c.sell.price)+'</b></div>';
  h+='</div>';
  // 写真
  const ph=PHOTOS[c.id]||[];
  h+='<h2>写真（'+ph.length+'）<span class="sp"></span><button class="sm" onclick="aiStart()">写真から推定</button><label class="sm" style="cursor:pointer"><span class="badge" style="padding:5px 10px">＋ 追加</span><input type="file" accept="image/*" multiple style="display:none" onchange="addPhotos(this.files)"></label></h2>';
  h+='<div class="card">'+(ph.length?'<div class="photos">'+ph.map(p=>'<img src="'+p.url+'" alt="" onclick="viewPhoto(\''+p.id+'\')">').join('')+'</div>':'<div class="muted sm">写真なし（刻印・シリアル・ソールの傷・購入時の状態などを残しておけます）</div>')+'</div>';
  // メモ
  h+='<h2>メモ</h2><div class="card"><textarea onchange="setBasic(\'memo\',this.value)" id="ta_memo" placeholder="Webで調べにくい情報（個体差・刻印・前オーナー情報など）">'+esc(c.memo||'')+'</textarea>'+micBtn('ta_memo')+'</div>';
  h+='<div class="row" style="margin-top:18px"><button onclick="dupClub()">このクラブを複製</button><button onclick="clubJsonOut()">JSONで書き出す</button><span style="flex:1"></span><button class="warn" onclick="trashClub()">ゴミ箱へ移す</button></div>';
  h+='<p class="xs muted">複製は基本情報とシャフト・グリップだけを写します（実測・ラウンド情報・購入売却・写真は写しません）。</p>';
  return h;
}
async function setBasic(k,v){ const c=clubById(ST.id); if(!c) return; const f=BASIC.find(x=>x.k===k);
  if(f&&f.req&&(v==null||v==='')){ render(); return; }
  const before=c[k]; c[k]=(f&&f.n)?toNum(v):v; await saveClub(c);
  if(c.nameAuto){ $('cname').value=nameOf(c); } $('ttl').textContent=nameOf(c); toast('保存しました');
  if(k==='num'&&String(v||'').trim()&&String(before||'')!==String(v||'')&&c.maker&&c.series&&await aiKey()) specStart(true); }
async function setName(v){ const c=clubById(ST.id); v=v.trim(); if(!v){ c.nameAuto=true; } else { c.nameAuto=false; c.name=v; } await saveClub(c); render(); toast('保存しました'); }
async function resetName(){ const c=clubById(ST.id); c.nameAuto=true; await saveClub(c); render(); }

function editHist(sec,hid){
  const c=clubById(ST.id), d=F[sec];
  let x; if(d.hist){ x=hid?c[sec].find(h=>h.id===hid):{date:today()}; } else { x=c[sec]||{}; }
  if(!x) return;
  if(!d.hist && !x.date) x=Object.assign({date:today()},x);
  let h='<h3>'+esc(d.ttl)+(d.hist?(hid?'（編集）':'（追加）'):'')+'</h3><form id="hf" onsubmit="return false">'+d.f.map(f=>fld(f,x[f.k])).join('')+'</form>';
  h+='<div class="row" style="margin-top:6px"><button class="pri" onclick="saveHist(\''+sec+'\','+(hid?'\''+hid+'\'':'null')+')">保存</button><button onclick="closeModal()">キャンセル</button><span style="flex:1"></span>'+
     ((d.hist&&hid)||(!d.hist&&Object.keys(c[sec]||{}).length)?'<button class="warn sm" onclick="delHist(\''+sec+'\','+(hid?'\''+hid+'\'':'null')+')">この記録を消す</button>':'')+'</div>';
  if(sec==='meas') h+='<p class="xs muted">リシャフト・鉛・グリップ交換のあとは、上書きせず新しい日付で追加してください（変化を比べられます）。</p>';
  openModal(h);
}
async function saveHist(sec,hid){
  const c=clubById(ST.id), d=F[sec], fm=$('hf'), o={};
  d.f.forEach(f=>{ const v=fm.elements[f.k].value; o[f.k]=(f.t==='num'||f.n)?toNum(v):(v.trim?v.trim():v); if(o[f.k]==='') o[f.k]=(f.t==='num'||f.n)?null:''; });
  if(d.f.some(f=>f.t==='num'&&fm.elements[f.k].value.trim()!==''&&o[f.k]==null)){ alert('数値の欄に数字以外が入っています。'); return; }
  if(sec==='play'){ if(o.distLo!=null||o.distHi!=null) setDist(o,o.distLo,o.distHi); else { delete o.distLo; delete o.distHi; } }
  if(d.hist){ if(hid){ const i=c[sec].findIndex(h=>h.id===hid); o.id=hid; c[sec][i]=o; } else { o.id=uid('h'); c[sec].push(o); } }
  else c[sec]=o;
  await saveClub(c); closeModal(); render(); toast('保存しました');
}
async function delHist(sec,hid){
  if(!confirm('この記録を消します。よろしいですか？\n（消したあとはバックアップからしか戻せません）')) return;
  const c=clubById(ST.id); if(F[sec].hist) c[sec]=c[sec].filter(h=>h.id!==hid); else c[sec]={};
  await saveClub(c); closeModal(); render(); toast('消しました');
}
async function dupClub(){ const s=clubById(ST.id), c=newClub();
  ['kind','num','maker','series','year','setName','loftSpec','lieSpec','status','nameAuto'].forEach(k=>c[k]=s[k]);
  if(!s.nameAuto) c.name=s.name+'（複製）';
  c.shafts=JSON.parse(JSON.stringify(s.shafts)).map(h=>Object.assign(h,{id:uid('h')}));
  c.grips=JSON.parse(JSON.stringify(s.grips)).map(h=>Object.assign(h,{id:uid('h')}));
  await saveClub(c); openClub(c.id); toast('複製しました。番手を直すと、ロフト・ライをカタログから取り直せます'); }
/* クラブ1本の詳細を JSON で書き出す（v0.3.7）。写真は入れない。閲覧・AIへの相談・受け渡し用で、読み込みには使わない（復元はバックアップで） */

function clubJsonSave(){ const c=clubById(ST.id); download(new Blob([$('txout').value],{type:'application/json'}),'club-ledger_club_'+String(nameOf(c)).replace(/[\\\/:*?"<>|\s]+/g,'_')+'_'+stamp()+'.json'); }
async function trashClub(){ const c=clubById(ST.id);
  if(!confirm('「'+nameOf(c)+'」をゴミ箱へ移します。\n（データ › ゴミ箱 からいつでも戻せます）')) return;

/* ---------- 写真 ---------- */
async function shrink(file){ const MAX=1600;
  let bmp; try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){ bmp=await createImageBitmap(file); }
  const r=Math.min(1,MAX/Math.max(bmp.width,bmp.height)), cv=document.createElement('canvas');
  cv.width=Math.round(bmp.width*r); cv.height=Math.round(bmp.height*r); cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise(res=>cv.toBlob(res,'image/jpeg',0.85)); }
async function addPhotos(files){ const c=clubById(ST.id); let n=0;
  for(const f of files){ try{ const blob=await shrink(f); await dbPut('photos',{id:uid('p'),clubId:c.id,blob,date:today(),caption:'',createdAt:nowIso()}); n++; }catch(e){ alert('読み込めない画像がありました: '+f.name); } }
  await loadAll(); render(); toast(n+'枚追加しました'); }

async function delPhoto(pid){ if(!confirm('この写真を削除します。元に戻せません（バックアップに入っていれば戻せます）。')) return;

/* ---------- 重量フロー ---------- */
const YM={ total:{l:'総重量',u:'g',tol:5,get:m=>m.total}, balance:{l:'バランス',u:'',tol:1.5,get:m=>balNum(m.balance),fmt:balStr},
  cpm:{l:'振動数',u:'cpm',tol:8,get:m=>m.cpm}, loft:{l:'実測ロフト',u:'°',tol:1.5,get:m=>m.loft}, lie:{l:'実測ライ',u:'°',tol:1,get:m=>m.lie} };
function fit(pts){ const n=pts.length; if(n<3) return null; let sx=0,sy=0,sxx=0,sxy=0; pts.forEach(p=>{sx+=p.x;sy+=p.y;sxx+=p.x*p.x;sxy+=p.x*p.y;});
  const den=n*sxx-sx*sx; if(!den) return null; const a=(n*sxy-sx*sy)/den, b=(sy-a*sx)/n; return {a,b,f:x=>a*x+b}; }
function setFlow(k,v){ ST[k]=v; render(); }
function viewFlow(){
  const ym=YM[ST.flowY];
  let L=sortClubs(liveClubs().filter(c=>c.status==='bag'||(ST.flowSpare&&c.status==='spare')));
  if(!ST.flowPT) L=L.filter(c=>c.kind!=='PT');
  const pts=[], miss=[];
  L.forEach((c,i)=>{ const m=latest(c.meas)||{}; const y=ym.get(m); const x=ST.flowX==='len'?m.length:i;
    if(y==null||x==null) miss.push(c); else pts.push({c,x,y}); });
  let h='<div class="card grid2">'+
    '<label class="f"><span>横軸</span><select onchange="setFlow(\'flowX\',this.value)">'+optHtml([['len','長さ（実測）'],['ord','番手順']],ST.flowX).replace('<option value=""></option>','')+'</select></label>'+
    '<label class="f"><span>縦軸</span><select onchange="setFlow(\'flowY\',this.value)">'+optHtml(Object.keys(YM).map(k=>[k,YM[k].l]),ST.flowY).replace('<option value=""></option>','')+'</select></label>'+
    '<label class="row sm"><input type="checkbox" style="width:auto" '+(ST.flowSpare?'checked':'')+' onchange="setFlow(\'flowSpare\',this.checked)">控えも含める</label>'+
    '<label class="row sm"><input type="checkbox" style="width:auto" '+(ST.flowPT?'checked':'')+' onchange="setFlow(\'flowPT\',this.checked)">パターも含める</label></div>';
  if(pts.length<2){ return h+'<div class="card muted">図にするには、バッグのクラブ2本以上に「実測」の'+ym.l+(ST.flowX==='len'?'と長さ':'')+'を入れてください。</div>'+missHtml(miss); }
  const ft=fit(pts); pts.forEach(p=>{ p.res=ft?p.y-ft.f(p.x):null; p.out=ft?Math.abs(p.res)>ym.tol:false; });
  // SVG
  const W=360,H=250,pl=42,pr=12,pt=14,pb=30;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y).concat(ft?[ft.f(Math.min(...xs)),ft.f(Math.max(...xs))]:[]);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const px=(x1-x0)||1, py=(y1-y0)||1; x0-=px*.06; x1+=px*.06; y0-=py*.12; y1+=py*.12;
  const sx=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr), sy=y=>H-pb-(y-y0)/(y1-y0)*(H-pt-pb);
  let g='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="重量フロー">';
  for(let i=0;i<=4;i++){ const yv=y0+(y1-y0)*i/4, yy=sy(yv); g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(yy+3)+'" text-anchor="end">'+esc(ym.fmt?ym.fmt(yv):Math.round(yv*10)/10)+'</text>'; }
  if(ST.flowX==='len'){ for(let i=0;i<=4;i++){ const xv=x0+(x1-x0)*i/4; g+='<text x="'+sx(xv)+'" y="'+(H-pb+14)+'" text-anchor="middle">'+xv.toFixed(1)+'″</text>'; } }
  if(ft){ const a=Math.min(...xs), b=Math.max(...xs); g+='<line x1="'+sx(a)+'" y1="'+sy(ft.f(a))+'" x2="'+sx(b)+'" y2="'+sy(ft.f(b))+'" stroke="var(--accent)" stroke-dasharray="5 4" stroke-width="1.5"/>'; }
  pts.forEach(p=>{ const cx=sx(p.x), cy=sy(p.y), col=p.out?'var(--warn)':'var(--accent)';
    g+='<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="'+col+'"><title>'+esc(nameOf(p.c))+'</title></circle><text class="lbl" x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle">'+esc(p.c.num||nameOf(p.c))+'</text>';
    if(ST.flowX==='ord') g+='<text x="'+cx+'" y="'+(H-pb+14)+'" text-anchor="middle">'+esc(p.c.num||'')+'</text>'; });
  g+='</svg>';
  h+='<div class="card">'+g+'<div class="xs muted">点線＝近似直線。近似線から'+ym.tol+(ym.u||'ポイント')+'を超えて外れたクラブを<span style="color:var(--warn)">赤</span>で示します（許容幅は仮の値です）。</div></div>';
  h+='<div class="card"><table><tr><th>クラブ</th><th>'+(ST.flowX==='len'?'長さ':'順')+'</th><th>'+esc(ym.l)+'</th><th>近似線との差</th></tr>'+
    pts.map(p=>'<tr><td><a href="#" onclick="openClub(\''+p.c.id+'\');return false">'+esc(nameOf(p.c))+'</a></td><td>'+(ST.flowX==='len'?p.x.toFixed(2)+'″':'')+'</td><td>'+esc(ym.fmt?ym.fmt(p.y):p.y)+'</td><td class="'+(p.out?'out':'')+'">'+(p.res==null?'':(p.res>0?'+':'')+(Math.round(p.res*10)/10)+(ym.u||''))+'</td></tr>').join('')+'</table></div>';
  return h+missHtml(miss);
}
function missHtml(m){ return m.length?'<div class="xs muted">実測が足りず図に入っていないクラブ: '+m.map(c=>esc(nameOf(c))).join('、')+'</div>':''; }

/* ---------- 飛距離の階段（入れ替えの検討） ----------
   検討中の構成は ST.lad（クラブIDの配列）に持つだけで、保存しない。
   「この構成をバッグにする」を押したときだけ、確認のうえ状態（バッグ⇔控え）を書き換える。 */
const LAD_WIDE=25, LAD_NEAR=5;   // 間が空きすぎ／近すぎの目安（y）。仮の値
function ladDist(c){ const p=latest(c.play); return p&&p.dist!=null?p.dist:null; }
function ladIds(){ if(!ST.lad) ST.lad=liveClubs().filter(c=>c.status==='bag').map(c=>c.id);
  ST.lad=ST.lad.filter(id=>{ const c=clubById(id); return c&&!c.deletedAt; }); return ST.lad; }
function ladToggle(id){ const a=ladIds(); const i=a.indexOf(id); if(i<0) a.push(id); else a.splice(i,1);
  const y=window.scrollY; render(); window.scrollTo(0,y); }
function ladReset(){ ST.lad=null; render(); }
function ladDiff(){ const ids=ladIds(), L=liveClubs();
  return { add:L.filter(c=>ids.includes(c.id)&&c.status!=='bag'), rm:L.filter(c=>c.status==='bag'&&!ids.includes(c.id)) }; }
async function ladApply(){ const d=ladDiff(); if(!d.add.length&&!d.rm.length) return;
  const msg='次のとおりバッグの中身を変えます。\n'+(d.add.length?'\nバッグに入れる:\n'+d.add.map(c=>'・'+nameOf(c)).join('\n'):'')+(d.rm.length?'\n控えに移す:\n'+d.rm.map(c=>'・'+nameOf(c)).join('\n'):'')+'\n\nよろしいですか？';
  if(!confirm(msg)) return;
  for(const c of d.add){ c.status='bag'; await saveClub(c); }
  for(const c of d.rm){ c.status='spare'; await saveClub(c); }
  ST.lad=null; render(); toast('バッグの中身を変えました（バッグ '+liveClubs().filter(x=>x.status==='bag').length+'本）'); }
/* 一覧で飛距離を入れる: 最新の記録が今日なら書き換え、そうでなければ今日の日付で新しい記録を足す（過去の記録は残す）。空欄を選んでも消さない */
/* v0.3.7: 1つの値の選択欄をやめ、「下限〜上限」の2つの欄にした（片方だけ入れれば1点の記録） */
function ladSel(c){ const p=latest(c.play), lo=p?(hasRng(p)?p.distLo:p.dist):null, hi=p&&hasRng(p)?p.distHi:null;
  const inp=(v,ph)=>'<input inputmode="numeric" aria-label="飛距離の'+ph+'" placeholder="'+ph+'" value="'+(v==null?'':v)+'" onchange="ladSetDist(\''+c.id+'\',this.parentNode)">';
  return '<span class="drng">'+inp(lo,'下限')+'〜'+inp(hi,'上限')+'y</span>'; }
/* 最新の記録が今日なら書き換え、そうでなければ今日の日付で新しい記録を足す（過去の記録は残す）。v0.3.6 と同じ */
async function putDist(c,lo,hi){ const p=latest(c.play);
  if(p&&p.date===today()) setDist(p,lo,hi); else { const q={id:uid('h'),date:today(),dist:null,note:''}; setDist(q,lo,hi); c.play.push(q); }
  await saveClub(c); }
async function ladSetDist(id,box){ const c=clubById(id); if(!c) return; const ins=box.querySelectorAll('input'), y=window.scrollY;
  const lo=toNum(ins[0].value), hi=toNum(ins[1].value);
  if((ins[0].value.trim()&&lo==null)||(ins[1].value.trim()&&hi==null)){ render(); window.scrollTo(0,y); toast('数字で入れてください'); return; }
  if(lo==null&&hi==null){ render(); window.scrollTo(0,y); toast('空欄にはできません（記録はクラブの画面で消せます）'); return; }
  await putDist(c,lo,hi); ladLater(box); toast(nameOf(c)+' を '+distTxt(latest(c.play))+' にしました（'+today()+' の記録）'); }

/* 下限を入れて上限へ移るときに描き直すと入力中の欄が消えるので、2つの欄からフォーカスが外れてから描き直す */
function ladLater(box){ const redo=()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); };
  setTimeout(()=>{ if(box.isConnected&&box.contains(document.activeElement)) box.addEventListener('focusout',()=>setTimeout(()=>{ if(!box.contains(document.activeElement)) redo(); },0),{once:true}); else redo(); },0); }
/* ---------- JSON で飛距離を取り込む ----------
   形: {"format":"club-ledger-distance","version":1,"items":[{"num":"7i","lo":135,"hi":146}, …]}（1点なら "dist":140）
   今のバッグのクラブに番手だけで当てる。当たらない・2本以上に当たる番手は取り込まず、画面に出す */
function numKey(s,kind){ s=String(s==null?'':s).replace(/[！-～]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/[\s番]/g,'').toUpperCase().replace(/度|DEG/,'°');
  if(/^(DR|D|DRIVER|1W|W1)$/.test(s)) return '1W';
  let m;
  if((m=/^(\d+)(\+?)(W|FW)(\+?)$/.exec(s))) return m[1]+(m[2]||m[4]?'+':'')+'W';
  if((m=/^(\d+)(H|U|UT|HY)$/.exec(s))) return m[1]+'U';
  if((m=/^(\d+)I$/.exec(s))) return m[1]+'I';
  if((m=/^P$|^PW$/.exec(s))) return 'PW';
  if(/^(AW|GW|SW|LW)$/.test(s)) return s;
  if((m=/^(\d+)°?$/.exec(s))&&+m[1]>=40) return m[1]+'°';
  if((m=/^(\d+)(\+?)$/.exec(s))){ const k={W:'W',FW:'W',UT:'U',I:'I'}[kind]; if(k) return m[1]+(k==='W'?m[2]:'')+k; if(m[2]) return m[1]+'+W'; }
  return s; }
function distImport(file){ if(!file) return; const r=new FileReader();
  r.onload=()=>{ let o; try{ o=JSON.parse(r.result); }catch(e){ alert('JSON として読めませんでした。'); return; }
    const items=Array.isArray(o)?o:(o&&Array.isArray(o.items)?o.items:null);
    if(!items){ alert('飛距離の取込用 JSON ではありません（items がありません）。\nバックアップの読み込みは「データ」画面からです。'); return; }
    const bag=liveClubs().filter(c=>c.status==='bag'), ok=[], ng=[];
    items.forEach(it=>{ const lo0=toNum(it.lo!=null?it.lo:it.dist), hi0=toNum(it.hi!=null?it.hi:it.dist), lab=String(it.num==null?'':it.num);
      if(lo0==null&&hi0==null){ ng.push([lab,'飛距離が入っていません']); return; }
      const k=numKey(lab), hit=bag.filter(c=>numKey(c.num,c.kind)===k);
      if(!hit.length) ng.push([lab,'今のバッグにこの番手がありません']);
      else if(hit.length>1) ng.push([lab,'今のバッグに同じ番手が'+hit.length+'本あります（'+hit.map(nameOf).join('、')+'）']);
      else if(ok.some(x=>x.c===hit[0])) ng.push([lab,'同じクラブに当たる行が前にもあります']);
      else ok.push({c:hit[0],lab,lo:lo0,hi:hi0}); });
    DIMP=ok;
    const lst=(a,f)=>'<div class="sm">'+a.map(f).join('')+'</div>';
    openModal('<h3>飛距離を取り込む</h3>'+
      (ok.length?'<p class="sm">次の <b>'+ok.length+'</b> 本の飛距離を、今日（'+today()+'）の記録として入れます。今日の記録があるクラブは書き換え、無いクラブは記録を足します（前の記録は残ります）。</p>'+
        lst(ok,x=>{ const q={}; setDist(q,x.lo,x.hi); const cur=latest(x.c.play); return '<div class="row"><span>'+esc(x.lab)+' → <b>'+esc(nameOf(x.c))+'</b></span><span style="flex:1"></span><span class="xs muted">'+esc(cur?distTxt(cur)||'なし':'なし')+' →</span> <b>'+esc(distTxt(q))+'</b></div>'; }):'<p class="sm">取り込めるクラブがありませんでした。</p>')+
      (ng.length?'<div class="notice" style="margin-top:8px"><b>取り込めなかった番手（'+ng.length+'）</b>'+ng.map(x=>'<div>・'+esc(x[0]||'（番手なし）')+': '+esc(x[1])+'</div>').join('')+'<div class="xs">番手の書き方をそろえるか、クラブの画面から入れてください。</div></div>':'')+
      '<div class="row" style="margin-top:10px">'+(ok.length?'<button class="pri" onclick="distImportRun()">取り込む</button>':'')+'<button onclick="closeModal()">'+(ok.length?'キャンセル':'閉じる')+'</button></div>'); };
  r.readAsText(file); }
let DIMP=null;
async function distImportRun(){ if(!DIMP) return; for(const x of DIMP) await putDist(x.c,x.lo,x.hi);
  const n=DIMP.length; DIMP=null; closeModal(); render(); toast(n+'本の飛距離を取り込みました（'+today()+' の記録）'); }
function viewLadder(){
  const ids=ladIds(), d=ladDiff();
  const inSet=liveClubs().filter(c=>ids.includes(c.id));
  const withD=inSet.filter(c=>c.kind!=='PT'&&ladDist(c)!=null).sort((a,b)=>ladDist(b)-ladDist(a)||nameOf(a).localeCompare(nameOf(b)));
  const noD=sortClubs(inSet.filter(c=>c.kind!=='PT'&&ladDist(c)==null)), pts=inSet.filter(c=>c.kind==='PT');
  const changed=d.add.length||d.rm.length, n=inSet.length;
  let h='<div class="card"><div class="row"><span>検討中の構成 <b>'+n+'</b> 本</span>'+(n>14?'<span class="badge w">14本を超えています</span>':'')+
    (changed?'<span class="badge">今のバッグから '+(d.add.length?'＋'+d.add.length:'')+(d.add.length&&d.rm.length?' ':'')+(d.rm.length?'−'+d.rm.length:'')+'</span>':'<span class="xs muted">今のバッグと同じ</span>')+'</div>'+
    '<p class="xs muted" style="margin:6px 0 0">下の「外す」「入れる」で試せます。試すだけではデータは変わりません。飛距離は各行の「下限〜上限」の欄で直せます（片方だけなら1点。すぐ保存され、今日の日付の記録になります）。階段は幅の中央で並べます。</p>'+
    '<div class="row" style="margin-top:6px"><label style="cursor:pointer"><span class="badge" style="padding:6px 10px">JSONで飛距離を取り込む</span><input type="file" accept="application/json,.json" style="display:none" onchange="distImport(this.files[0]);this.value=\'\'"></label></div>'+
    (changed?'<div class="row" style="margin-top:8px"><button class="pri" onclick="ladApply()">この構成をバッグにする</button><button onclick="ladReset()">今のバッグに戻す</button></div>':'')+'</div>';
  if(!withD.length) h+='<div class="card muted">飛距離が入っているクラブがありません。クラブを開いて「プレー」の想定距離（キャリー）を入れてください。</div>';
  else { const ends=withD.map(c=>{ const p=latest(c.play); return hasRng(p)?[p.distLo,p.distHi]:[ladDist(c),ladDist(c)]; }), mx=Math.max(...ends.map(e=>e[1])), lo=Math.max(0,Math.min(...ends.map(e=>e[0]))-30);   // 差が見えやすいよう、最短より30y手前を棒の起点にする
    h+='<div class="card lad">';
    withD.forEach((c,i)=>{ const v=ladDist(c);
      if(i>0){ const g=ladDist(withD[i-1])-v, cls=g>=LAD_WIDE?'wide':(g<=LAD_NEAR?'near':'');
        h+='<div class="gap '+cls+'">差 '+g+'y'+(cls==='wide'?'（間が空いています）':cls==='near'?'（近すぎます）':'')+'</div>'; }
      const isNew=c.status!=='bag';
      h+='<div class="lrow'+(isNew?' new':'')+'"><a href="#" class="lnm" onclick="openClub(\''+c.id+'\');return false">'+esc(c.num||'')+' <span class="xs muted">'+esc([c.maker,c.series].filter(Boolean).join(' '))+'</span></a>'+
        '<div class="lbar"><div class="bw">'+(()=>{ const pc=x=>mx>lo?Math.max(0,Math.min(100,12+88*(x-lo)/(mx-lo))):100, p=latest(c.play);
          return '<div style="width:'+pc(v)+'%"></div>'+(hasRng(p)?'<div class="rg" style="left:'+pc(p.distLo)+'%;width:'+Math.max(1,pc(p.distHi)-pc(p.distLo))+'%"></div>':''); })()+'</div></div>'+ladSel(c)+
        '<button class="sm" onclick="ladToggle(\''+c.id+'\')">外す</button></div>'; });
    h+='<div class="xs muted" style="margin-top:6px">差が'+LAD_WIDE+'y以上を「間が空いています」、'+LAD_NEAR+'y以下を「近すぎます」としています（目安は仮の値です）。'+(withD.some(c=>c.status!=='bag')?'色の付いた行は、今はバッグに入っていないクラブです。':'')+'</div></div>'; }
  if(noD.length||pts.length) h+='<div class="card"><div class="sm"><b>階段に入っていないクラブ</b></div>'+
    noD.map(c=>'<div class="row"><a href="#" onclick="openClub(\''+c.id+'\');return false">'+esc(nameOf(c))+'</a><span style="flex:1"></span>'+ladSel(c)+'<button class="sm" onclick="ladToggle(\''+c.id+'\')">外す</button></div>').join('')+
    pts.map(c=>'<div class="row"><span>'+esc(nameOf(c))+'</span><span class="xs muted">パター（本数には数えます）</span><span style="flex:1"></span><button class="sm" onclick="ladToggle(\''+c.id+'\')">外す</button></div>').join('')+'</div>';
  const cand=sortClubs(liveClubs().filter(c=>!ids.includes(c.id)&&c.status!=='sold'&&c.status!=='gone'));
  h+='<h2>入れ替え候補（'+cand.length+'）</h2>';
  h+=cand.length?'<div class="card">'+cand.map(c=>{ const v=ladDist(c);
      return '<div class="row"><a href="#" onclick="openClub(\''+c.id+'\');return false">'+esc(nameOf(c))+'</a>'+(c.status==='bag'?'<span class="xs muted">今はバッグ</span>':'')+'<span style="flex:1"></span>'+ladSel(c)+'<button class="sm" onclick="ladToggle(\''+c.id+'\')">入れる</button></div>'; }).join('')+'</div>'
    :'<div class="card muted xs">控えのクラブがありません。</div>';
  return h; }

async function aiKey(){ const r=await dbGet('meta','geminiKey'); return r&&r.v||''; }
async function apiErr(r){ let m=''; try{ const j=await r.json(); m=(j.error&&j.error.message)||''; }catch(e){} return apiErrMsg(r.status,m); }
function apiErrMsg(status,m){ const r={status};
  if(r.status===400&&/API key/i.test(m)) return new Error('APIキーが正しくありません。データ › Gemini（AI連携）で入れ直してください。');
  if(r.status===403) return new Error('このキーでは Gemini API を使えません（キーの制限・APIが無効など）。'+(m?'\n詳細: '+m:''));
  if(r.status===429) return new Error('利用の上限に達しました（無料枠は1分・1日あたりの回数に上限があります）。しばらく待ってから試してください。');
  if(r.status===503||r.status===500) return new Error('Gemini が混み合っています（'+r.status+'・Google 側の一時的な混雑）。少し待ってから試してください。');
  return new Error('Gemini API のエラー（'+r.status+'）'+(m?': '+m:'')); }
async function geminiModels(key){
  let r; try{ r=await fetch(GAPI+'models?pageSize=1000',{headers:{'x-goog-api-key':key}}); }catch(e){ throw new Error('通信できませんでした（オフラインの可能性）。'); }
  if(!r.ok) throw await apiErr(r);
  const j=await r.json();
  const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''))
    .filter(n=>/^gemini-/.test(n)&&!/(tts|image|embedding|live|audio|learnlm|native|computer|robotics|thinking)/i.test(n));
  const ver=n=>{ const m=/gemini-(\d+(?:\.\d+)?)/.exec(n); return m?parseFloat(m[1]):0; };
  const score=n=>{ let s=0;
    if(n==='gemini-flash-latest') s=1000; else if(n==='gemini-pro-latest') s=700;
    else if(/-flash$/.test(n)) s=500+ver(n)*10; else if(/-flash-lite/.test(n)) s=200+ver(n); else if(/-flash/.test(n)) s=400+ver(n)*10; else if(/-pro/.test(n)) s=300+ver(n)*10; else s=100+ver(n);
    if(/(preview|exp)/.test(n)) s-=250; return s; };
  return names.sort((a,b)=>score(b)-score(a)); }
/* 速さのため: ①答える前に考える処理（thinking）を最小にする ②前回うまくいったモデルは一覧を取り直さずに使う。
   thinking の指定方法はモデルの世代で違い、受け付けないモデルもあるので、400（thinking 関連）なら次の指定→指定なしへ順に落とす。
   うまくいったモデルと指定は meta.geminiModel に {v:モデル名, think:指定} で覚える（旧形式 {v} もそのまま読める）。
   503/500（Google 側の混雑）は次のモデルで試す。混雑の代わりに通ったモデルは覚えない（混雑が解ければ元のモデルに戻るように）。 */
function thinkOpts(m){ return /gemini-2\.5/.test(m) ? [{thinkingBudget:0}] : [{thinkingLevel:'minimal'},{thinkingLevel:'low'}]; }
async function geminiTry(key,body,m,hint,save=true){
  let opts=thinkOpts(m).concat([null]);
  if(hint!==undefined) opts=[hint].concat(opts.filter(o=>JSON.stringify(o)!==JSON.stringify(hint)));
  let lastErr=null;
  for(const t of opts){
    const gc=Object.assign({},body.generationConfig||{}); if(t) gc.thinkingConfig=t; else delete gc.thinkingConfig;
    const b=Object.assign({},body,{generationConfig:gc});
    let r; try{ r=await fetch(GAPI+'models/'+m+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify(b)}); }
    catch(e){ throw new Error('通信できませんでした（オフラインの可能性）。'); }
    if(r.status===404) return null;   // 一覧にあっても使えないモデルがある
    if(!r.ok){ let msg=''; try{ const j=await r.json(); msg=(j.error&&j.error.message)||''; }catch(e){}
      lastErr=apiErrMsg(r.status,msg);
      if(r.status===400&&t&&/think/i.test(msg)) continue;   // この thinking 指定を受け付けないモデル → 次の指定で
      if(r.status===503||r.status===500) return {busy:lastErr};   // 混雑 → 呼び出し元が次のモデルで試す
      throw lastErr; }
    const j=await r.json(); if(save) await dbPut('meta',{k:'geminiModel',v:m,think:t}); return {model:m,json:j}; }
  throw lastErr||new Error('Gemini API のエラー'); }
async function geminiGenerate(key,body){
  const rec=await dbGet('meta','geminiModel')||{};
  let busy=null;
  if(rec.v){ const res=await geminiTry(key,body,rec.v,rec.think); if(res&&!res.busy) return res; if(res) busy=res.busy; }
  const list=(await geminiModels(key)).filter(x=>x!==rec.v); if(!list.length) throw busy||new Error('このキーで使える Gemini のモデルが見つかりませんでした。');
  for(const m of list.slice(0,5)){ const res=await geminiTry(key,body,m,undefined,!busy); if(res&&!res.busy) return res; if(res) busy=busy||res.busy; }
  if(busy) throw busy;
  throw new Error('使える Gemini のモデルが見つかりませんでした（候補: '+list.slice(0,5).join(', ')+'）。'); }

async function aiApply(){

  const tgt={}, isSet=v=>v!=null&&v!=='';
  pick.forEach(r=>{ const f=r.f;

      const clash=h&&pick.some(p=>p.f.sec===f.sec&&isSet(h[p.f.f]));

    tgt[f.sec][f.f]=r.est; });
  if(memo) c.memo=(c.memo?c.memo+'\n\n':'')+'【写真から推定 '+today()+'】'+R.notes;

function blobB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); }); }
async function toggleRec(id){

function settingText(scope){
  const st=scope==='all'?STATUS.map(x=>x[0]):(scope==='bs'?['bag','spare']:['bag']);
  const isOdd=c=>!STATUS.some(x=>x[0]===c.status);   // 状態が未設定（空欄など）
  const L=sortClubs(liveClubs()).filter(c=>st.includes(c.status)||(scope==='all'&&isOdd(c)));
  const lines=['【クラブセッティング】'+today()+'（'+L.length+'本）'];
  STATUS.concat([['__odd','状態が未設定']]).forEach(([k,lab])=>{ const a=L.filter(c=>k==='__odd'?isOdd(c):c.status===k); if(!a.length) return;
    lines.push('', '■ '+lab+'（'+a.length+'本）');
    a.forEach(c=>{ const spec=[c.loftSpec!=null?'ロフト'+c.loftSpec+'°':'',c.lieSpec!=null?'ライ'+c.lieSpec+'°':'',c.year?c.year+'年':''].filter(Boolean).join(' / ');
      const mm=[c.maker,c.series].filter(Boolean).join(' ');
      lines.push('・'+nameOf(c)+(mm&&nameOf(c).indexOf(mm)<0?'（'+mm+'）':''));
      if(spec) lines.push('　カタログ: '+spec);
      const sh=sumOf('shafts',latest(c.shafts)), gr=sumOf('grips',latest(c.grips)), me=sumOf('meas',latest(c.meas)), pl=sumOf('play',latest(c.play));
      if(sh) lines.push('　シャフト: '+sh);
      if(gr) lines.push('　グリップ: '+gr);
      if(me) lines.push('　実測: '+me);
      if(pl) lines.push('　想定距離: '+pl); }); });
  return lines.join('\n'); }

      $('updbtn').onclick=()=>{ reloading=true; w.postMessage({type:'SKIP_WAITING'}); }; };
    if(reg.waiting&&navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; w.addEventListener('statechange',()=>{ if(w.state==='installed'&&navigator.serviceWorker.controller) show(w); }); });
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloading) location.reload(); });
}

/* ---------- 起動 ---------- */
(async function(){
  $('ver').textContent=APP_VERSION;
  try{ db=await idbOpen(); await loadAll(); }
  catch(e){ $('app').innerHTML='<div class="card notice">端末内の保存領域を開けませんでした（'+esc(e&&e.message||e)+'）。プライベートブラウズでは使えないことがあります。</div>'; return; }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  render(); setupSW();
})();
</script>
